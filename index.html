<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pierre François Passager – Accompagnateur Touristique Ardèche</title>
    <style>
        :root {
            --bg-color: #fdfbf7;
            --text-color: #2c3e2e;
            --primary-color: #3d5a45;
            --accent-color: #d97736;
            --card-bg: #ffffff;
            --border-color: #e6dfd3;
            --font-serif: 'Playfair Display', Georgia, serif;
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background-color: rgba(253, 251, 247, 0.95);
            border-bottom: 1px solid var(--border-color);
            z-index: 1000;
            backdrop-filter: blur(5px);
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: var(--font-serif);
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary-color);
            text-decoration: none;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 2rem;
        }

        nav a {
            text-decoration: none;
            color: var(--text-color);
            font-weight: 500;
            transition: color 0.3s;
        }

        nav a:hover {
            color: var(--accent-color);
        }

        .btn-call {
            background-color: var(--primary-color);
            color: white;
            padding: 0.5rem 1.2rem;
            border-radius: 20px;
            text-decoration: none;
            font-weight: 600;
            transition: background-color 0.3s;
        }

        .btn-call:hover {
            background-color: var(--accent-color);
            color: white;
        }

        section {
            padding: 6rem 2rem 4rem 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .hero {
            padding-top: 10rem;
            text-align: center;
            min-height: 80vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .hero-image {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 2rem;
            border: 3px solid var(--primary-color);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .badge {
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 2px;
            color: var(--accent-color);
            margin-bottom: 1rem;
            font-weight: bold;
        }

        h1 {
            font-family: var(--font-serif);
            font-size: 3.5rem;
            color: var(--primary-color);
            line-height: 1.2;
            margin-bottom: 1.5rem;
        }

        .subtitle {
            font-family: var(--font-serif);
            font-size: 1.5rem;
            font-style: italic;
            margin-bottom: 2rem;
            color: #555;
        }

        .hero p {
            max-width: 700px;
            font-size: 1.2rem;
            margin-bottom: 2.5rem;
        }

        .btn-primary {
            background-color: var(--accent-color);
            color: white;
            padding: 1rem 2.5rem;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.1rem;
            box-shadow: 0 4px 15px rgba(217, 119, 54, 0.3);
            transition: transform 0.3s, background-color 0.3s;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            background-color: #c46225;
        }

        h2 {
            font-family: var(--font-serif);
            font-size: 2.5rem;
            color: var(--primary-color);
            margin-bottom: 2rem;
            text-align: center;
        }

        .intro-text {
            text-align: center;
            max-width: 800px;
            margin: 0 auto 4rem auto;
            font-size: 1.1rem;
        }

        .grid-services {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2.5rem;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 0;
            overflow: hidden;
            transition: transform 0.3s, box-shadow 0.3s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(61, 90, 69, 0.08);
        }

        .card-img {
            width: 100%;
            height: 220px;
            object-fit: cover;
        }

        .card-content {
            padding: 2rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
        }

        .card h3 {
            font-family: var(--font-serif);
            font-size: 1.6rem;
            color: var(--primary-color);
            margin-bottom: 1rem;
        }

        .card p {
            color: #555;
            margin-bottom: 1.5rem;
            flex-grow: 1;
        }

        .card-price {
            border-top: 1px solid var(--border-color);
            padding-top: 1rem;
            font-size: 0.9rem;
            color: #777;
        }

        .card-price strong {
            font-size: 1.4rem;
            color: var(--text-color);
        }

        .grid-places {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            text-align: center;
        }

        .place-item {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 2rem;
            border-radius: 8px;
        }
