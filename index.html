<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pierre-François Passager – Accompagnateur Touristique Ardèche</title>
    <style>
        :root {
            --bg-color: #fdfbf7;
            --text-color: #2c3e2e;
            --primary-color: #3d5a45;
            --accent-color: #d97736;
            --card-bg: #ffffff;
            --border-color: #e6dfd3;
            --font-serif: 'Playfair Display', Georgia, serif;
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        /* Menu de navigation stabilisé */
        header {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            width: 100%;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1.2rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .logo {
            font-family: var(--font-serif);
            font-size: 1.4rem;
            font-weight: bold;
            color: var(--primary-color);
            text-decoration: none;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 1.5rem;
            flex-wrap: wrap;
        }

        nav a {
            text-decoration: none;
            color: var(--text-color);
            font-weight: 500;
            font-size: 0.95rem;
            transition: color 0.3s;
        }

        nav a:hover {
            color: var(--accent-color);
        }

        .btn-call {
            background-color: var(--primary-color);
            color: white;
            padding: 0.5rem 1.2rem;
            border-radius: 20px;
            text-decoration: none;
            font-weight: 600;
            transition: background-color 0.3s;
        }

        .btn-call:hover {
            background-color: var(--accent-color);
        }

        /* Sections */
        section {
            padding: 5rem 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Zone d'accueil réajustée pour éviter les chevauchements */
        .hero {
            text-align: center;
            padding: 4rem 2rem 6rem 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .hero-badge {
            background-color: rgba(61, 90, 69, 0.1);
            color: var(--primary-color);
            padding: 0.6rem 1.5rem;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
            display: inline-block;
        }

        .badge {
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 2px;
            color: var(--accent-color);
            margin-bottom: 1rem;
            font-weight: bold;
            text-align: center;
        }

        h1 {
            font-family: var(--font-serif);
            font-size: 3.5rem;
            color: var(--primary-color);
            line-height: 1.2;
            margin-bottom: 1rem;
        }

        .subtitle {
            font-family: var(--font-serif);
            font-size: 1.5rem;
            font-style: italic;
            margin-bottom: 1.5rem;
            color: #555;
        }

        .hero p {
            max-width: 700px;
            font-size: 1.15rem;
            margin-bottom: 2.5rem;
            color: #444;
        }

        .btn-primary {
            background-color: var(--accent-color);
            color: white;
            padding: 1rem 2.5rem;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.1rem;
            box-shadow: 0 4px 15px rgba(217, 119, 54, 0.3);
            transition: transform 0.3s, background-color 0.3s;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            background-color: #c46225;
        }

        h2 {
            font-family: var(--font-serif);
            font-size: 2.5rem;
            color: var(--primary-color);
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .intro-text {
            text-align: center;
            max-width: 800px;
            margin: 0 auto 3rem auto;
            font-size: 1.1rem;
            color: #555;
        }

        /* Grille des cartes Prestations */
        .grid-services {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 2.5rem;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.3s, box-shadow 0.3s;
            display: flex;
            flex-direction: column;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(61, 90, 69, 0.08);
        }

        /* Conteneur d'image sécurisé */
        .card-img-container {
            width: 100%;
            height: 250px;
            background-color: #eae5db;
            overflow: hidden;
            position: relative;
        }

        .card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .card-content {
            padding: 2rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
        }

        .card h3 {
            font-family: var(--font-serif);
            font-size: 1.6rem;
            color: var(--primary-color);
            margin-bottom: 1rem;
        }

        .card p {
            color: #555;
            margin-bottom: 1.5rem;
            font-size: 0.95rem;
        }

        .card-price {
            border-top: 1px solid var(--border-color);
            padding-top: 1rem;
            font-size: 0.9rem;
            color: #777;
        }

        .card-price strong {
            font-size: 1.4rem;
            color: var(--text-color);
        }

        /* Grille des spots à découvrir */
        .grid-places {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1.5rem;
            text-align: center;
        }

        .place-item {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 2rem;
            border-radius: 8px;
        }

        .place-icon {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .place-item h4 {
            font-family: var(--font-serif);
            color: var(--primary-color);
            margin-bottom: 0.5rem;
        }

        /* Tarifs */
        .grid-pricing {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
            max-width: 950px;
            margin: 0 auto;
        }

        .price-box {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 3rem 2rem;
            text-align: center;
            position: relative;
        }

        .price-box.featured {
            border: 2px solid var(--accent-color);
            box-shadow: 0 10px 25px rgba(217, 119, 54, 0.1);
        }

        .price-tag {
            font-size: 0.9rem;
            color: #777;
            margin-bottom: 1.5rem;
        }

        .price-tag strong {
            font-size: 2.5rem;
            color: var(--primary-color);
            font-family: var(--font-serif);
        }

        .price-box ul {
            list-style: none;
            text-align: left;
            margin: 2rem 0;
            padding-left: 1.2rem;
        }

        .price-box li {
            margin-bottom: 0.8rem;
            position: relative;
            font-size: 0.95rem;
        }

        .price-box li::before {
            content: "✓";
            color: var(--accent-color);
            position: absolute;
            left: -1.2rem;
            font-weight: bold;
        }

        .featured-label {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--accent-color);
            color: white;
            padding: 0.2rem 1rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        /* Formulaire de Contact */
        .contact-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 3rem;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 3rem;
        }

        .contact-info h3 {
            font-family: var(--font-serif);
            font-size: 1.8rem;
            color: var(--primary-color);
            margin-bottom: 1.5rem;
        }

        .info-item {
            margin-bottom: 1.5rem;
        }

        .info-item strong {
            display: block;
            font-size: 1.05rem;
            margin-bottom: 0.2rem;
        }

        .info-item a {
            color: var(--accent-color);
            text-decoration: none;
            font-weight: 600;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }
