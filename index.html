<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<title>Kit Facebook – Pierre François Passager</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Josefin+Sans:wght@300;400;600&family=Lato:wght@300;400;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{background:#e8f5e9;font-family:'Lato',sans-serif;padding:2rem;}

h1{font-family:'Playfair+Display',serif;text-align:center;color:#1b5e20;margin-bottom:.3rem;font-size:1.6rem;}
.subtitle{text-align:center;font-family:'Josefin Sans',sans-serif;font-size:.75rem;letter-spacing:.2em;text-transform:uppercase;color:#4caf76;margin-bottom:2.5rem;}

/* ── SECTION LABELS ── */
.section-label{
  font-family:'Josefin Sans',sans-serif;font-size:.7rem;font-weight:600;
  letter-spacing:.25em;text-transform:uppercase;color:#2e7d32;
  margin:2.5rem 0 1rem;display:flex;align-items:center;gap:.8rem;
}
.section-label::after{content:'';flex:1;height:1px;background:#a5d6a7;}

/* ── BANNIÈRE FACEBOOK 820x312 ── */
.banner-wrap{
  width:820px;height:312px;position:relative;overflow:hidden;
  background: linear-gradient(135deg, #0f2d16 0%, #163d20 40%, #1b5e20 70%, #2e7d32 100%);
  margin:0 auto;
  box-shadow:0 8px 40px rgba(0,0,0,.25);
}
.banner-photo{
  position:absolute;right:0;top:0;bottom:0;width:380px;
  object-fit:cover;object-position:center top;
  mask-image:linear-gradient(to right, transparent 0%, black 30%);
  -webkit-mask-image:linear-gradient(to right, transparent 0%, black 30%);
  opacity:.85;
}
.banner-overlay{
  position:absolute;inset:0;
  background:linear-gradient(to right, rgba(15,45,22,.95) 0%, rgba(15,45,22,.7) 55%, transparent 100%);
}
/* decorative lines */
.banner-lines{position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(to bottom,#4caf76,#2e7d32);}
.banner-dot{position:absolute;left:20px;top:50%;transform:translateY(-50%);width:8px;height:8px;background:#4caf76;border-radius:50%;}
/* leaf motif */
.banner-leaf{
  position:absolute;right:50px;bottom:-20px;font-size:9rem;opacity:.06;transform:rotate(-20deg);
  color:#fff;user-select:none;
}
.banner-content{
  position:relative;z-index:2;
  padding:2rem 2.5rem;
  height:100%;display:flex;flex-direction:column;justify-content:center;
}
.banner-eyebrow{
  font-family:'Josefin Sans',sans-serif;font-size:.6rem;font-weight:600;
  letter-spacing:.35em;text-transform:uppercase;color:#80e89e;margin-bottom:1rem;
}
.banner-name{
  font-family:'Playfair Display',serif;font-size:2.6rem;font-weight:700;
  color:#fff;line-height:1.05;margin-bottom:.4rem;
}
.banner-name em{display:block;font-size:.55em;font-style:italic;color:#a5d6a7;font-weight:400;}
.banner-role{
  font-family:'Josefin Sans',sans-serif;font-size:.72rem;letter-spacing:.2em;
  text-transform:uppercase;color:#4caf76;margin-bottom:1.4rem;
}
.banner-phone{
  display:inline-flex;align-items:center;gap:.5rem;
  font-family:'Josefin Sans',sans-serif;font-size:.8rem;font-weight:600;
  letter-spacing:.1em;color:#fff;background:rgba(76,175,118,.25);
  border:1px solid rgba(76,175,118,.5);padding:.45rem 1rem;
}
.banner-phone::before{content:'📞';}

.banner-hint{
  margin:0.7rem auto 0;text-align:center;
  font-family:'Josefin Sans',sans-serif;font-size:.6rem;letter-spacing:.15em;
  text-transform:uppercase;color:#4caf76;opacity:.7;
}

/* ── POSTS ── */
.posts-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1.2rem;max-width:900px;margin:0 auto;}
.post-card{
  background:#fff;border-radius:4px;overflow:hidden;
  box-shadow:0 2px 12px rgba(0,0,0,.08);
  border-top:3px solid #2e7d32;
}
.post-header{
  background:linear-gradient(135deg,#0f2d16,#2e7d32);
  padding:.8rem 1.2rem;display:flex;align-items:center;gap:.8rem;
}
.post-avatar{
  width:40px;height:40px;border-radius:50%;border:2px solid #4caf76;
  object-fit:cover;object-position:center top;flex-shrink:0;
}
.post-meta strong{display:block;color:#fff;font-size:.85rem;}
.post-meta span{color:#a5d6a7;font-size:.7rem;font-family:'Josefin Sans',sans-serif;letter-spacing:.1em;}
.post-body{padding:1.2rem;}
.post-tag{
  display:inline-block;font-family:'Josefin Sans',sans-serif;font-size:.6rem;
  font-weight:600;letter-spacing:.15em;text-transform:uppercase;
  background:#e8f5e9;color:#2e7d32;padding:.25rem .7rem;border-radius:2px;margin-bottom:.7rem;
}
.post-body p{font-size:.92rem;line-height:1.7;color:#2d3a2d;}
.post-footer{
  padding:.7rem 1.2rem;border-top:1px solid #e8f5e9;
  display:flex;gap:.8rem;
}
.post-footer span{font-size:.75rem;color:#81c784;font-family:'Josefin Sans',sans-serif;}

/* ── BIO ── */
.bio-card{
  background:#fff;border-radius:4px;padding:2rem;
  box-shadow:0 2px 12px rgba(0,0,0,.08);border-left:4px solid #2e7d32;
  max-width:900px;margin:0 auto;
}
.bio-card h3{font-family:'Playfair Display',serif;color:#0f2d16;margin-bottom:1rem;font-size:1.1rem;}
.bio-text{font-size:.95rem;line-height:1.8;color:#2d3a2d;}
.bio-text strong{color:#2e7d32;}

/* ── INFOS PRATIQUES ── */
.info-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;max-width:900px;margin:0 auto;}
.info-card{
  background:#fff;border-radius:4px;padding:1.4rem;text-align:center;
  box-shadow:0 2px 12px rgba(0,0,0,.08);
}
.info-icon{font-size:1.8rem;margin-bottom:.6rem;display:block;}
.info-card h4{font-family:'Josefin Sans',sans-serif;font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;color:#4caf76;margin-bottom:.3rem;}
.info-card p{font-size:.9rem;color:#2d3a2d;font-weight:600;}

@media print{body{background:#fff;}}
</style>
</head>
